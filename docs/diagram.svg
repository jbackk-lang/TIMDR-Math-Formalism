<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Protokół TIMDR-Math-Formalism</title>
<desc>Sześć kroków testowania, czy struktura matematyczna jest realna, czy numerologią: hipoteza i pre-rejestracja, generowanie danych testowych i tła, bramka kontroli pozytywnej i negatywnej, warunkowe rozgałęzienie do testu Manna-Whitneya albo do zatrzymania przy niesprawnej metryce, i werdykt końcowy.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="96" x2="220" y2="156" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="460" y2="156" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="220" y1="212" x2="340" y2="272" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="212" x2="340" y2="272" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="300" y2="388" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="530" y2="388" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<line x1="300" y1="444" x2="300" y2="504" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="278" y="362" text-anchor="middle" font-size="12" fill="#5F5E5A">tak</text>
<text x="432" y="362" text-anchor="middle" font-size="12" fill="#5F5E5A">nie</text>

<g>
<rect x="220" y="40" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Hipoteza</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Krok 1 — pre-rejestracja</text>
</g>

<g>
<rect x="110" y="156" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Dane testowe</text>
<text x="220" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">np. liczby pierwsze</text>
</g>

<g>
<rect x="350" y="156" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="460" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Tło / kontrola</text>
<text x="460" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">losowe / AR(1)</text>
</g>

<g>
<rect x="210" y="272" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Kontrola +/- (bramka)</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Krok 5 — obie muszą przejść</text>
</g>

<g>
<rect x="180" y="388" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="300" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Test Manna-Whitneya</text>
<text x="300" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Krok 4 — nie "na oko"</text>
</g>

<g>
<rect x="440" y="388" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Bramka: NIE</text>
<text x="530" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">metryka zepsuta</text>
</g>

<g>
<rect x="180" y="504" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>

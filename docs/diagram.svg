<text x="300" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">efekt lub numerologia</text>
</g>

<rect x="154" y="596" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="174" y="603" dominant-baseline="central" font-size="12" fill="#444441">generowanie danych</text>
<rect x="342" y="596" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="362" y="603" dominant-baseline="central" font-size="12" fill="#444441">test statystyczny</text>
<rect x="508" y="596" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="528" y="603" dominant-baseline="central" font-size="12" fill="#444441">start / bramka nie przeszła</text>
</svg>
